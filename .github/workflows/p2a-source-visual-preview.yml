name: P2A Source Visual Preview

on:
  pull_request:
    branches:
      - agent/p1b-owner-gate-hardening
    paths:
      - "tools/scan_pipeline/scan_*.py"
      - "tools/scan_pipeline/run_p1_contracts.py"
      - "tests/scan_pipeline/test_scan_*.py"
      - "samples/jozz_scan_preview_*"
      - "samples/sample_jozz_vehicle_lab.cpp"
      - "samples/CMakeLists.txt"
      - ".github/workflows/p2a-source-visual-preview.yml"
  push:
    branches:
      - "agent/p2a-*"
    paths:
      - "tools/scan_pipeline/scan_*.py"
      - "tools/scan_pipeline/run_p1_contracts.py"
      - "tests/scan_pipeline/test_scan_*.py"
      - "samples/jozz_scan_preview_*"
      - "samples/sample_jozz_vehicle_lab.cpp"
      - "samples/CMakeLists.txt"
      - ".github/workflows/p2a-source-visual-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / stdlib
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile scan pipeline
        run: >-
          python -m py_compile
          tools/scan_pipeline/scan_inspect.py
          tools/scan_pipeline/scan_ply.py
          tools/scan_pipeline/scan_glb_quality.py
          tools/scan_pipeline/scan_dataset_inspect.py
          tools/scan_pipeline/scan_frames.py
          tools/scan_pipeline/scan_world_contracts.py
          tools/scan_pipeline/scan_import_bundle.py
          tools/scan_pipeline/scan_import_bundle_verify.py
          tools/scan_pipeline/scan_source_frame_contract.py
          tools/scan_pipeline/scan_owner_gate.py
          tools/scan_pipeline/scan_preview_pack.py
          tools/scan_pipeline/scan_preview_pack_verify.py
          tools/scan_pipeline/run_p1_contracts.py

      - name: Run canonical scan contracts
        run: python tools/scan_pipeline/run_p1_contracts.py
