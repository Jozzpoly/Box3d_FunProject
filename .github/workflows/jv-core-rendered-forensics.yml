name: JV_CORE Rendered Forensics

on:
  push:
    branches:
      - research/jv-core-rendered-forensics-2026-09-04

jobs:
  render-m6:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC dev command prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure exact donor samples
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBOX3D_SAMPLES=ON -DBOX3D_UNIT_TESTS=OFF -DBUILD_SHARED_LIBS=OFF

      - name: Build sample host
        run: cmake --build build --config Release --target samples

      - name: Capture M6 baseline visual
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force rendered-evidence | Out-Null
          $env:JOZZ_M6_DIAG = "0"
          $env:JOZZ_M6_WHEEL = "1"
          $env:JOZZ_M6_MOUNT = "1"
          $env:JOZZ_M6_DUMPER = "1"
          $env:JOZZ_M6_ARMTINT = "0"
          $env:JOZZ_M6_STEERING_RIG = "0"
          $env:JOZZ_M6_CAM = "-135,14,6,0,0.8,0"
          & .\build\bin\Release\samples.exe --sample-name "M6 Suspension Rig Lab" --frames 120 --screenshot "rendered-evidence/m6-baseline-visual.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture M6 diagnostic correspondence view
        shell: pwsh
        run: |
          $env:JOZZ_M6_DIAG = "1"
          $env:JOZZ_M6_WHEEL = "1"
          $env:JOZZ_M6_MOUNT = "1"
          $env:JOZZ_M6_DUMPER = "1"
          $env:JOZZ_M6_ARMTINT = "1"
          $env:JOZZ_M6_STEERING_RIG = "0"
          $env:JOZZ_M6_CAM = "-135,14,6,0,0.8,0"
          & .\build\bin\Release\samples.exe --sample-name "M6 Suspension Rig Lab" --frames 120 --screenshot "rendered-evidence/m6-diagnostic.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture M6 steering-rig view
        shell: pwsh
        run: |
          $env:JOZZ_M6_DIAG = "1"
          $env:JOZZ_M6_WHEEL = "1"
          $env:JOZZ_M6_MOUNT = "1"
          $env:JOZZ_M6_DUMPER = "1"
          $env:JOZZ_M6_ARMTINT = "1"
          $env:JOZZ_M6_STEERING_RIG = "1"
          $env:JOZZ_M6_CAM = "-135,14,6,0,0.8,0"
          & .\build\bin\Release\samples.exe --sample-name "M6 Suspension Rig Lab" --frames 120 --screenshot "rendered-evidence/m6-steering-rig.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: jv-core-m6-rendered-forensics
          path: rendered-evidence/*.png
          if-no-files-found: error
