name: JV_CORE Isolated Corner Forensics

on:
  push:
    branches:
      - research/jv-core-rendered-forensics-2026-09-04

jobs:
  render-corner:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC dev command prompt
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure exact donor samples
        run: cmake -B build -DBOX3D_SAMPLES=ON -DBOX3D_UNIT_TESTS=OFF -DBUILD_SHARED_LIBS=OFF

      - name: Build sample host
        run: cmake --build build --config Release --target samples

      - name: Warm host settings without evidence capture
        shell: pwsh
        run: |
          $env:JOZZ_M6_PRELOAD = "0.07"
          & .\build\bin\Release\samples.exe --sample-name "M6 Suspension Rig Lab" --frames 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture isolated old mount at street preload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force rendered-corner | Out-Null
          $env:JOZZ_M6_DIAG = "1"
          $env:JOZZ_M6_WHEEL = "0"
          $env:JOZZ_M6_MOUNT = "1"
          $env:JOZZ_M6_BODY = "0"
          $env:JOZZ_M6_DUMPER = "1"
          $env:JOZZ_M6_ARMTINT = "1"
          $env:JOZZ_M6_STEERING_RIG = "0"
          $env:JOZZ_M6_PRELOAD = "0.07"
          $env:JOZZ_M6_CAM = "-135,12,4.2,0.70,0.45,-0.55"
          & .\build\bin\Release\samples.exe --sample-name "M6 Suspension Rig Lab" --frames 120 --screenshot "rendered-corner/m6-mount-isolated-007.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture isolated old mount at offroad preload
        shell: pwsh
        run: |
          $env:JOZZ_M6_DIAG = "1"
          $env:JOZZ_M6_WHEEL = "0"
          $env:JOZZ_M6_MOUNT = "1"
          $env:JOZZ_M6_BODY = "0"
          $env:JOZZ_M6_DUMPER = "1"
          $env:JOZZ_M6_ARMTINT = "1"
          $env:JOZZ_M6_STEERING_RIG = "0"
          $env:JOZZ_M6_PRELOAD = "0.15"
          $env:JOZZ_M6_CAM = "-135,12,4.2,0.70,0.45,-0.55"
          & .\build\bin\Release\samples.exe --sample-name "M6 Suspension Rig Lab" --frames 120 --screenshot "rendered-corner/m6-mount-isolated-015.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture isolated steering rig at street preload
        shell: pwsh
        run: |
          $env:JOZZ_M6_DIAG = "1"
          $env:JOZZ_M6_WHEEL = "0"
          $env:JOZZ_M6_MOUNT = "1"
          $env:JOZZ_M6_BODY = "0"
          $env:JOZZ_M6_DUMPER = "1"
          $env:JOZZ_M6_ARMTINT = "1"
          $env:JOZZ_M6_STEERING_RIG = "1"
          $env:JOZZ_M6_PRELOAD = "0.07"
          $env:JOZZ_M6_CAM = "-135,12,4.2,0.70,0.45,-0.55"
          & .\build\bin\Release\samples.exe --sample-name "M6 Suspension Rig Lab" --frames 120 --screenshot "rendered-corner/m6-steering-isolated-007.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture isolated steering rig at offroad preload
        shell: pwsh
        run: |
          $env:JOZZ_M6_DIAG = "1"
          $env:JOZZ_M6_WHEEL = "0"
          $env:JOZZ_M6_MOUNT = "1"
          $env:JOZZ_M6_BODY = "0"
          $env:JOZZ_M6_DUMPER = "1"
          $env:JOZZ_M6_ARMTINT = "1"
          $env:JOZZ_M6_STEERING_RIG = "1"
          $env:JOZZ_M6_PRELOAD = "0.15"
          $env:JOZZ_M6_CAM = "-135,12,4.2,0.70,0.45,-0.55"
          & .\build\bin\Release\samples.exe --sample-name "M6 Suspension Rig Lab" --frames 120 --screenshot "rendered-corner/m6-steering-isolated-015.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload isolated-corner evidence
        uses: actions/upload-artifact@v4
        with:
          name: jv-core-m6-isolated-corner-forensics
          path: rendered-corner/*.png
          if-no-files-found: error
