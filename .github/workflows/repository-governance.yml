name: Repository Governance

# No GitHub schedule. The external recurring operator is controlled by Issue #11.
on:
  pull_request:
    branches:
      - jozz-vehicle-sandbox-m0
      - agent/project-refoundation-audit-v1
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "AI_PROJECT_MEMORY.md"
      - ".automation/**"
      - "docs/README.md"
      - "docs/REPOSITORY_STRUCTURE_PL.md"
      - "docs/PROJECT_OPERATING_PLAN_PL.md"
      - "docs/PROJECT_CHARTER_PL.md"
      - "docs/PROJECT_REFOUNDATION_AUDIT_2026_07_22_PL.md"
      - "docs/PROJECT_INVENTORY.json"
      - "docs/PROJECT_FORENSIC_INVENTORY_2026_07_22_PL.md"
      - "docs/BRANCH_RETENTION_PLAN_2026_07_22.json"
      - "docs/DOCUMENT_LIFECYCLE_2026_07_22.json"
      - "docs/TECH_DEBT_PL.md"
      - "docs/HOTKEY_AUDIT_PL.md"
      - "docs/PROJECT_DIRECTION_PL.md"
      - "docs/PLAN_*_PL.md"
      - "docs/*/CURRENT_STATE.md"
      - "docs/scan_import/00_START_HERE.md"
      - "tools/project/**"
      - "tests/project/**"
      - ".github/workflows/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  push:
    branches:
      - agent/project-refoundation-audit-v1
      - "automation/**"
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "AI_PROJECT_MEMORY.md"
      - ".automation/**"
      - "docs/README.md"
      - "docs/REPOSITORY_STRUCTURE_PL.md"
      - "docs/PROJECT_OPERATING_PLAN_PL.md"
      - "docs/PROJECT_CHARTER_PL.md"
      - "docs/PROJECT_REFOUNDATION_AUDIT_2026_07_22_PL.md"
      - "docs/PROJECT_INVENTORY.json"
      - "docs/PROJECT_FORENSIC_INVENTORY_2026_07_22_PL.md"
      - "docs/BRANCH_RETENTION_PLAN_2026_07_22.json"
      - "docs/DOCUMENT_LIFECYCLE_2026_07_22.json"
      - "docs/TECH_DEBT_PL.md"
      - "docs/HOTKEY_AUDIT_PL.md"
      - "docs/PROJECT_DIRECTION_PL.md"
      - "docs/PLAN_*_PL.md"
      - "docs/*/CURRENT_STATE.md"
      - "docs/scan_import/00_START_HERE.md"
      - "tools/project/**"
      - "tests/project/**"
      - ".github/workflows/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    name: Repository authority and workflow contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile governance tools
        run: >-
          python -m py_compile
          tools/project/repository_audit.py
          tools/project/refoundation_inventory_audit.py
          tools/project/document_lifecycle_audit.py
          tools/project/repository_forensic_snapshot.py

      - name: Produce tracked-tree and remote-branch forensic snapshot
        run: >-
          python tools/project/repository_forensic_snapshot.py
          --remote origin
          --require-remote
          --output build/governance/repository_forensic_snapshot.json

      - name: Upload forensic snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-forensic-snapshot-${{ github.run_id }}
          path: build/governance/repository_forensic_snapshot.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate automation control contract
        run: python tools/automation/validate_control.py

      - name: Audit repository authority and CI routing
        run: python tools/project/repository_audit.py

      - name: Audit re-foundation inventory and branch retention
        run: python tools/project/refoundation_inventory_audit.py

      - name: Audit project document lifecycle
        run: python tools/project/document_lifecycle_audit.py

      - name: Run adversarial governance tests
        run: python -m unittest discover -s tests/project -p "test_*.py" -v
