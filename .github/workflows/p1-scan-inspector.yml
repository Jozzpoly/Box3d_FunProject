name: P1 Scan Inspector

on:
  pull_request:
    branches:
      - photogrammetry/import-v2-foundation
      - agent/p1-dataset-inspector-staging
      - agent/p1b-world-import-contract-staging
      - agent/p1b-inspector-bundle-staging
    paths:
      - "tools/scan_pipeline/scan_*.py"
      - "tools/scan_pipeline/run_p1_contracts.py"
      - "tools/gate.ps1"
      - "tests/scan_pipeline/test_scan_*.py"
      - ".github/workflows/p1-scan-inspector.yml"
  push:
    branches:
      - "agent/p1b-*"
    paths:
      - "tools/scan_pipeline/scan_*.py"
      - "tools/scan_pipeline/run_p1_contracts.py"
      - "tools/gate.ps1"
      - "tests/scan_pipeline/test_scan_*.py"
      - ".github/workflows/p1-scan-inspector.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnostic:
    name: Canonical diagnostic / Ubuntu / Python 3.11 / stdlib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile P1 modules
        run: >-
          python -m py_compile
          tools/scan_pipeline/scan_inspect.py
          tools/scan_pipeline/scan_ply.py
          tools/scan_pipeline/scan_glb_quality.py
          tools/scan_pipeline/scan_dataset_inspect.py
          tools/scan_pipeline/scan_frames.py
          tools/scan_pipeline/scan_world_contracts.py
          tools/scan_pipeline/scan_import_bundle.py
          tools/scan_pipeline/scan_import_bundle_verify.py
          tools/scan_pipeline/scan_source_frame_contract.py
          tools/scan_pipeline/scan_owner_gate.py
          tools/scan_pipeline/run_p1_contracts.py

      - name: Run canonical contracts and capture output
        id: contracts
        shell: bash
        run: |
          set +e
          python tools/scan_pipeline/run_p1_contracts.py > p1-test-output.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 180 p1-test-output.txt
          exit 0

      - name: Publish one failure diagnostic to the PR
        if: github.event_name == 'pull_request' && steps.contracts.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- p1-ci-diagnostic -->';
            const raw = fs.readFileSync('p1-test-output.txt', 'utf8');
            const tail = raw.slice(-12000).replaceAll('```', '~~~');
            const body = `${marker}\n## P1 canonical test failure\n\n\`\`\`text\n${tail}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Resolve prior diagnostic after success
        if: github.event_name == 'pull_request' && steps.contracts.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- p1-ci-diagnostic -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n## P1 canonical diagnostic resolved\n\nThe latest canonical compile and dependency-free P1 contract run passed for commit \`${context.sha}\`.`,
              });
            }

      - name: Enforce canonical contract result
        if: steps.contracts.outputs.exit_code != '0'
        shell: bash
        run: exit 1

  python-contracts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / numpy=${{ matrix.numpy }}
    needs: diagnostic
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
        numpy: [false, true]
        exclude:
          - os: ubuntu-latest
            python: "3.11"
            numpy: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install optional NumPy backend
        if: matrix.numpy
        run: python -m pip install --upgrade numpy

      - name: Compile P1 modules
        run: >-
          python -m py_compile
          tools/scan_pipeline/scan_inspect.py
          tools/scan_pipeline/scan_ply.py
          tools/scan_pipeline/scan_glb_quality.py
          tools/scan_pipeline/scan_dataset_inspect.py
          tools/scan_pipeline/scan_frames.py
          tools/scan_pipeline/scan_world_contracts.py
          tools/scan_pipeline/scan_import_bundle.py
          tools/scan_pipeline/scan_import_bundle_verify.py
          tools/scan_pipeline/scan_source_frame_contract.py
          tools/scan_pipeline/scan_owner_gate.py
          tools/scan_pipeline/run_p1_contracts.py

      - name: Run scan-pipeline contracts
        run: python tools/scan_pipeline/run_p1_contracts.py
